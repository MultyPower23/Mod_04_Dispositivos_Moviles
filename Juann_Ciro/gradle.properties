# Opciones de Gradle para todo el proyecto; lo que se configure desde Android Studio tiene prioridad sobre este archivo.
# Memoria máxima que puede usar Gradle al compilar (2 GB) y codificación UTF-8 para que las tildes se lean bien.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Compilación de módulos en paralelo; queda desactivada porque el proyecto tiene un solo módulo.
# org.gradle.parallel=true
# Usa las librerías AndroidX, que reemplazan a las antiguas librerías de soporte de Android.
android.useAndroidX=true
# Cada librería genera su propia clase R solo con sus recursos, lo que hace la compilación más liviana.
android.nonTransitiveRClass=true